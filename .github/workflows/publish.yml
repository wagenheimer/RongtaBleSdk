name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    # Building a *library* for iOS/MacCatalyst/Windows doesn't need a Mac/Xcode or a Windows-only
    # toolchain — just each workload's reference assemblies, which install on any OS. Windows was
    # picked over macOS because macOS runner minutes are scarce/queued on free GitHub accounts.
    runs-on: windows-latest

    permissions:
      id-token: write # required for the Trusted Publishing OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Pack
        run: dotnet pack src/RongtaBleSdk/RongtaBleSdk.csproj -c Release -o artifacts

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: wagenheimer

      - name: NuGet push
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
